```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Puja Darshan — Secure Admin</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <main class="panel">
    <h1>Puja Darshan</h1>
    <p class="subtitle">Secure Admin Panel</p>

    <form id="login-form">
      <label for="username">Admin username</label>
      <input id="username" name="username" autocomplete="username"
             required maxlength="100">

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required maxlength="200">

      <button type="submit">Sign in</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <section id="admin-area" hidden>
      <div class="admin-heading">
        <div>
          <h2>Welcome, Admin</h2>
          <p id="signed-in-as"></p>
        </div>
        <button id="logout-button" class="secondary" type="button">
          Log out
        </button>
      </div>

      <section class="tool-section">
        <h3>Upload Photos & Videos</h3>
        <p class="help">
          JPG, PNG, WebP, MP4, MOV or WebM. Maximum 50 MB per file.
        </p>

        <form id="upload-form">
          <label for="media-file">Choose a photo or video</label>
          <input
            id="media-file"
            name="file"
            type="file"
            accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm"
            required
          >
          <button id="upload-button" type="submit">Upload Media</button>
        </form>
        <p id="upload-status" role="status" aria-live="polite"></p>
      </section>

      <section class="tool-section">
        <div class="gallery-heading">
          <h3>Media Gallery</h3>
          <button id="refresh-button" class="secondary" type="button">
            Refresh
          </button>
        </div>
        <p class="help">
          Uploaded items appear here. Delete removes the selected item from
          Cloudinary.
        </p>
        <div id="media-gallery" class="media-grid"></div>
        <p id="gallery-status" role="status" aria-live="polite"></p>
      </section>
    </section>
  </main>
</body>
</html>
```
